:root{
  --paper:#FBF9F6;
  --paper-dark:#F0E6D8;
  --ink:#131313;
  --ink-soft:#756D64;
  --line:#DFD3C2;
  --mindset:#554132;
  --culture:#728639;
  --upsell:#800020;
  --stamp:#728639;
  --card-shadow: 0 1px 0 rgba(19,19,19,0.04), 0 8px 20px -12px rgba(19,19,19,0.25);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'RL Light', sans-serif;
  font-weight:300;
  min-height:100vh;
  padding:20px 14px 60px;
}

.wrap{max-width:640px;margin:0 auto;}

.masthead{
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:18px;
}
.masthead img{
  height:32px;
  width:auto;
  flex-shrink:0;
}
.masthead-text{flex:1;}
.masthead h1{
  font-family:'RL Display',sans-serif;
  font-weight:800;
  letter-spacing:0.01em;
  text-transform:uppercase;
  font-size:19px;
  margin:0;
  line-height:1.1;
}
.masthead .sub{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:0.04em;
  margin-top:2px;
}

.tabs{
  display:flex;
  gap:0;
  margin-bottom:18px;
  border:2px solid var(--ink);
  border-radius:3px;
  overflow:hidden;
}
.tab{
  flex:1;
  text-align:center;
  padding:9px 6px;
  font-family:'RL Medium',sans-serif;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.04em;
  font-size:12.5px;
  cursor:pointer;
  background:var(--paper);
  color:var(--ink);
  user-select:none;
  transition:background 0.15s;
}
.tab + .tab{border-left:2px solid var(--ink);}
.tab.active{background:var(--ink);color:var(--paper);}

.view{display:none;}
.view.active{display:block;}

/* Ticket card */
.ticket{
  background:#FFFFFF;
  border:1px solid var(--ink);
  border-radius:4px;
  box-shadow:var(--card-shadow);
  padding:0;
  margin-bottom:16px;
  position:relative;
}
.ticket-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  border-bottom:1px dashed var(--ink);
}
.date-mono{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
}
.badge{
  font-family:'RL Medium',sans-serif;
  font-weight:500;
  font-size:11px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:20px;
  color:#fff;
}
.badge.mindset{background:var(--mindset);}
.badge.culture{background:var(--culture);}
.badge.upsell{background:var(--upsell);}

.perforation{
  height:0;
  border-top:2px dashed var(--line);
  margin:0 16px;
  position:relative;
}
.perforation::before,.perforation::after{
  content:'';
  position:absolute;
  top:-6px;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--paper);
  border:1px solid var(--ink);
}
.perforation::before{left:-22px;}
.perforation::after{right:-22px;}

.ticket-body{padding:16px;}
.field-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  margin-bottom:4px;
}
.situation{
  font-size:14px;
  margin:0 0 14px;
  color:var(--ink-soft);
}
.action{
  font-family:'RL Display',sans-serif;
  font-weight:800;
  font-size:19px;
  line-height:1.35;
  margin:0 0 14px;
}
.why{
  font-size:13px;
  color:var(--ink-soft);
  font-style:italic;
  margin:0;
}

.stamp{
  font-family:'RL Medium',sans-serif;
  font-weight:500;
  font-size:11px;
  letter-spacing:0.04em;
  color:#fff;
  border-radius:20px;
  padding:5px 12px;
  text-transform:uppercase;
  background:var(--stamp);
  white-space:nowrap;
}
.badge-group{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.panel{
  background:#FFFFFF;
  border:1px solid var(--ink);
  border-radius:4px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:var(--card-shadow);
}
.panel h3{
  font-family:'RL Medium',sans-serif;
  text-transform:uppercase;
  letter-spacing:0.04em;
  font-size:13px;
  margin:0 0 12px;
  color:var(--ink-soft);
}

select, input[type=text], textarea{
  width:100%;
  font-family:'RL Light',sans-serif;
  font-size:14px;
  padding:9px 10px;
  border:1px solid var(--ink);
  border-radius:3px;
  background:#fff;
  color:var(--ink);
  margin-bottom:12px;
}
textarea{resize:vertical;min-height:56px;}
label.small{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  display:block;
  margin-bottom:5px;
}

button{
  font-family:'RL Medium',sans-serif;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:0.04em;
  font-size:13px;
  padding:11px 16px;
  border:2px solid var(--ink);
  border-radius:3px;
  background:var(--ink);
  color:var(--paper);
  cursor:pointer;
  width:100%;
}
button:active{transform:translateY(1px);}
button.secondary{
  background:transparent;
  color:var(--ink);
}
button.ghost{
  background:transparent;
  color:var(--ink-soft);
  border:1px solid var(--line);
  font-size:11.5px;
  padding:8px 10px;
}

.outlet-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.outlet-row:last-child{border-bottom:none;}
.outlet-name{
  font-family:'RL Medium',sans-serif;
  font-weight:500;
  font-size:14px;
}
.outlet-meta{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
}
.status-dot{
  display:inline-block;
  width:9px;height:9px;
  border-radius:50%;
  margin-right:6px;
  vertical-align:middle;
}
.status-dot.done{background:var(--culture);}
.status-dot.pending{background:var(--upsell);}

.streak{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  text-align:right;
}
.streak b{color:var(--ink);font-size:13px;}

.loading{
  text-align:center;
  padding:30px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
}

.add-topic-toggle{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--ink-soft);
  cursor:pointer;
  text-decoration:underline;
  display:inline-block;
  margin-top:4px;
}
.hidden{display:none;}

.mode-select{
  display:flex;
  gap:6px;
  margin:14px 16px 0;
}
.mode-btn{
  flex:1;
  text-align:center;
  padding:7px 4px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  border:1px solid var(--ink);
  border-radius:20px;
  cursor:pointer;
  background:transparent;
  color:var(--ink);
  user-select:none;
}
.mode-btn.active{background:var(--ink);color:var(--paper);}

.extra-block{
  margin:14px 16px 16px;
  padding:12px 14px;
  border:1px dashed var(--ink);
  border-radius:4px;
  background:rgba(255,255,255,0.5);
}
.extra-block .field-label{margin-bottom:8px;}
.quiz-option{
  display:block;
  width:100%;
  text-align:left;
  padding:8px 10px;
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:3px;
  background:#fff;
  font-family:'RL Light',sans-serif;
  font-size:13px;
  cursor:pointer;
  font-weight:300;
  color:var(--ink);
}
.quiz-option:last-child{margin-bottom:0;}
.quiz-option.correct{border-color:var(--culture);background:#eaf1ea;}
.quiz-option.wrong{border-color:var(--upsell);background:#f6e9e6;}
.roleplay-line{
  font-size:13.5px;
  margin:0 0 8px;
  color:var(--ink);
}
.roleplay-line b{font-family:'RL Medium',sans-serif;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}

.role-group{margin-bottom:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.role-group:last-child{margin-bottom:0;}
.role-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  background:var(--paper-dark);
  cursor:pointer;
  user-select:none;
}
.role-title{
  font-family:'RL Medium',sans-serif;
  font-weight:500;
  font-size:13.5px;
  color:var(--ink);
}
.role-right{display:flex;align-items:center;gap:10px;}
.role-header .count{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
}
.role-header .count.has-selected{color:var(--culture);}
.chevron{
  font-size:11px;
  color:var(--ink-soft);
  transition:transform 0.15s;
  display:inline-block;
}
.chevron.open{transform:rotate(180deg);}
.check-list{
  padding:4px 6px;
  background:#fff;
}
.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 8px;
  border-bottom:1px solid var(--paper);
  cursor:pointer;
  user-select:none;
}
.check-row:last-child{border-bottom:none;}
.check-box{
  width:18px;
  height:18px;
  flex-shrink:0;
  border:1.5px solid var(--ink-soft);
  border-radius:4px;
  position:relative;
  background:#fff;
}
.check-row.checked .check-box{
  background:var(--culture);
  border-color:var(--culture);
}
.check-row.checked .check-box::after{
  content:'';
  position:absolute;
  left:5px;
  top:1px;
  width:5px;
  height:9px;
  border:solid #fff;
  border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.check-label{
  font-family:'RL Light',sans-serif;
  font-size:13.5px;
  color:var(--ink);
}
.check-row.checked .check-label{color:var(--ink);font-family:'RL Medium',sans-serif;font-weight:500;}
.roster-manage-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed var(--line);
  font-size:13px;
}
.roster-manage-row:last-child{border-bottom:none;}
.roster-x{
  color:var(--upsell);
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:2px 8px;
}
.roster-add-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.roster-add-row select{margin-bottom:0;width:38%;}
.roster-add-row input{margin-bottom:0;flex:1;}
.roster-add-row button{width:auto;padding:9px 14px;}

@media (max-width: 480px){
  body{padding:14px 10px 50px;}
  .masthead img{height:26px;}
  .masthead h1{font-size:16px;}
  .ticket-head{flex-wrap:wrap;gap:8px;}
  .roster-add-row{flex-direction:column;}
  .roster-add-row select, .roster-add-row input, .roster-add-row button{width:100%;}
  .action{font-size:17px;}
  .check-row{padding:11px 8px;}
  .tab{font-size:11.5px;padding:10px 6px;}
}

.leader-list{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:12px;padding:4px 6px;}

.recent-log{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  padding:8px 0;
  border-bottom:1px dashed var(--line);
}
.recent-log:last-child{border-bottom:none;}
.recent-log b{color:var(--ink);}
</style>
</head>

let todayStr = new Date().toISOString().slice(0,10);
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

function dayIndexOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff/86400000);
}

async function getRoster(){
  try{
    const res = await window.storage.get('roster', true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  await window.storage.set('roster', JSON.stringify(ROSTER_SEED), true);
  return ROSTER_SEED;
}

async function saveRoster(roster){
  await window.storage.set('roster', JSON.stringify(roster), true);
}

async function getTopicBank(){
  try{
    const res = await window.storage.get('topic-bank', true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  await window.storage.set('topic-bank', JSON.stringify(STARTER_TOPICS), true);
  return STARTER_TOPICS;
}

function todaysTopic(bank){
  const idx = dayIndexOf(todayStr) % bank.length;
  return bank[idx];
}

async function getLog(date, session){
  try{
    const res = await window.storage.get(`log:${date}:${session}`, true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return null;
}

async function getIndex(session){
  try{
    const res = await window.storage.get(`log-index:${session}`, true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return [];
}

async function saveLog(date, session, data){
  await window.storage.set(`log:${date}:${session}`, JSON.stringify(data), true);
  const idx = await getIndex(session);
  if(!idx.includes(date)){
    idx.push(date);
    idx.sort();
    await window.storage.set(`log-index:${session}`, JSON.stringify(idx), true);
  }
}

function computeStreak(dates){
  if(!dates.length) return 0;
  const set = new Set(dates);
  let streak = 0;
  let cur = new Date(todayStr+'T00:00:00');
  // if today not done yet, start checking from yesterday
  if(!set.has(todayStr)) cur.setDate(cur.getDate()-1);
  while(true){
    const ds = cur.toISOString().slice(0,10);
    if(set.has(ds)){
      streak++;
      cur.setDate(cur.getDate()-1);
    } else break;
  }
  return streak;
}

// ---------- LEADER VIEW ----------
let currentMode = 'ticket';
let selectedAttendance = new Set();
let extraNamesValue = '';
let extraTipValue = '';
let attendanceLoaded = false;
let expandedRoles = new Set();
let selectedLeaders = new Set();

function renderLeaderPicker(){
  const el = document.getElementById('leaderPicker');
  el.innerHTML = `<div class="leader-list">${LEADER_LIST.map(name=>`
    <div class="check-row leader-row ${selectedLeaders.has(name)?'checked':''}" data-name="${name.replace(/"/g,'&quot;')}">
      <span class="check-box"></span><span class="check-label">${name}</span>
    </div>
  `).join('')}</div>`;
  el.querySelectorAll('.leader-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const name = row.dataset.name;
      if(selectedLeaders.has(name)) selectedLeaders.delete(name);
      else selectedLeaders.add(name);
      row.classList.toggle('checked');
    });
  });
}

let currentSession = autoSession(new Date());

function chipListHTML(roster){
  return ROLES.map(role=>{
    const names = roster[role] || [];
    if(!names.length) return '';
    const selectedCount = names.filter(n=>selectedAttendance.has(n)).length;
    const isOpen = expandedRoles.has(role);
    const rows = names.map(n=>`
      <div class="check-row ${selectedAttendance.has(n)?'checked':''}" data-name="${n.replace(/"/g,'&quot;')}">
        <span class="check-box"></span><span class="check-label">${n}</span>
      </div>
    `).join('');
    return `<div class="role-group" data-role-group="${role}">
      <div class="role-header" data-role="${role}">
        <span class="role-title">${role}</span>
        <span class="role-right">
          <span class="count ${selectedCount>0?'has-selected':''}">${selectedCount}/${names.length}</span>
          <span class="chevron ${isOpen?'open':''}">▾</span>
        </span>
      </div>
      <div class="check-list ${isOpen?'':'hidden'}">${rows}</div>
    </div>`;
  }).join('');
}

function extraBlockHTML(topic, mode){
  if(mode === 'quiz'){
    const opts = topic.quizOptions.map((o,i)=>`<button class="quiz-option" data-idx="${i}" data-correct="${topic.quizCorrect}">${o}</button>`).join('');
    return `
      <div class="extra-block">
        <div class="field-label">Quick Quiz — Ask Staff</div>
        <p class="roleplay-line">${topic.quizQ}</p>
        <div id="quizOptions">${opts}</div>
      </div>
    `;
  }
  if(mode === 'roleplay'){
    return `
      <div class="extra-block">
        <div class="field-label">Roleplay — 1 Minute</div>
        <p class="roleplay-line"><b>Setup: </b>${topic.roleplaySetup}</p>
        <p class="roleplay-line"><b>Guide: </b>${topic.roleplayGuide}</p>
      </div>
    `;
  }
  return '';
}

async function renderTicket(){
  // auto-detect session based on current time; reload attendance if it changed
  const detected = autoSession(new Date());
  if(detected !== currentSession){
    currentSession = detected;
    attendanceLoaded = false;
  }

  const container = document.getElementById('ticketContainer');
  container.innerHTML = '<div class="loading">Preparing today&#39;s ticket…</div>';
  const bank = await getTopicBank();
  const roster = await getRoster();
  const topic = todaysTopic(bank);
  const existing = await getLog(todayStr, currentSession);

  if(!attendanceLoaded){
    if(existing && existing.attendance){
      selectedAttendance = new Set(existing.attendance.names || []);
      extraNamesValue = existing.attendance.extra || '';
    } else {
      selectedAttendance = new Set();
      extraNamesValue = '';
    }
    extraTipValue = (existing && existing.extraTip) ? existing.extraTip : '';
    attendanceLoaded = true;
  }

  const catClass = topic.category;
  const catLabel = CAT_LABEL[topic.category];
  const hasExtras = topic.quizQ && topic.roleplaySetup;
  const isEvening = currentSession === 'Evening';

  const ticketBodyHTML = isEvening ? `
      <div class="ticket-body">
        <div class="field-label">Review — Today's Recap</div>
        <p class="action">${topic.action}</p>
        <div class="field-label">Why It Matters</div>
        <p class="why">${topic.why}</p>
      </div>
  ` : `
      <div class="ticket-body">
        <div class="field-label">Situation</div>
        <p class="situation">${topic.situation}</p>
        <div class="perforation"></div>
        <div class="field-label" style="margin-top:14px;">Concrete Action</div>
        <p class="action">${topic.action}</p>
        <div class="field-label">Why It Matters</div>
        <p class="why">${topic.why}</p>
      </div>
  `;

  container.innerHTML = `
    <div class="ticket">
      <div class="ticket-head">
        <span class="date-mono">${todayStr} · ${currentSession}</span>
        <div class="badge-group">
          <span class="badge ${catClass}">${catLabel}</span>
          ${existing ? '<span class="stamp">Done</span>' : ''}
        </div>
      </div>
      ${ticketBodyHTML}
      ${hasExtras ? `
      <div class="mode-select">
        <div class="mode-btn ${currentMode==='ticket'?'active':''}" data-mode="ticket">Ticket</div>
        <div class="mode-btn ${currentMode==='quiz'?'active':''}" data-mode="quiz">+ Quiz</div>
        <div class="mode-btn ${currentMode==='roleplay'?'active':''}" data-mode="roleplay">+ Roleplay</div>
      </div>
      <div id="extraBlockContainer">${extraBlockHTML(topic, currentMode)}</div>
      ` : ''}
    </div>

    <div class="panel">
      <h3>${existing ? 'Update Briefing Notes' : 'Mark Briefing Done'}</h3>
      <label class="small">Who attended — tap names</label>
      <div id="attendanceChips">${chipListHTML(roster)}</div>
      <label class="small" style="margin-top:10px;">+ other names (optional, comma separated)</label>
      <input type="text" id="extraNames" placeholder="e.g. freelance/trainee staff" value="${extraNamesValue.replace(/"/g,'&quot;')}">
      ${isEvening ? `
      <label class="small">Additional tips (optional, if any)</label>
      <textarea id="extraTip" placeholder="e.g. a new situation today worth sharing">${extraTipValue.replace(/</g,'&lt;')}</textarea>
      ` : ''}
      <label class="small">Notes (optional)</label>
      <textarea id="note" placeholder="e.g. staff still hesitant to try this directly">${existing ? existing.note : ''}</textarea>
      <button id="submitLogBtn">${existing ? 'Update Notes' : 'Mark Done'}</button>
    </div>
  `;

  if(hasExtras){
    container.querySelectorAll('.mode-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        extraNamesValue = document.getElementById('extraNames').value;
        const tipEl = document.getElementById('extraTip');
        if(tipEl) extraTipValue = tipEl.value;
        currentMode = btn.dataset.mode;
        renderTicket();
      });
    });
    if(currentMode === 'quiz'){
      container.querySelectorAll('.quiz-option').forEach(opt=>{
        opt.addEventListener('click', ()=>{
          const correct = parseInt(opt.dataset.correct);
          container.querySelectorAll('.quiz-option').forEach((o,i)=>{
            if(i === correct) o.classList.add('correct');
            else if(o === opt) o.classList.add('wrong');
          });
        });
      });
    }
  }

  container.querySelectorAll('.role-header').forEach(header=>{
    header.addEventListener('click', ()=>{
      const role = header.dataset.role;
      const list = header.parentElement.querySelector('.check-list');
      const chevron = header.querySelector('.chevron');
      if(expandedRoles.has(role)){
        expandedRoles.delete(role);
        list.classList.add('hidden');
        chevron.classList.remove('open');
      } else {
        expandedRoles.add(role);
        list.classList.remove('hidden');
        chevron.classList.add('open');
      }
    });
  });

  container.querySelectorAll('.check-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const name = row.dataset.name;
      if(selectedAttendance.has(name)) selectedAttendance.delete(name);
      else selectedAttendance.add(name);
      row.classList.toggle('checked');
      const roleGroup = row.closest('.role-group');
      const countEl = roleGroup.querySelector('.count');
      const total = roleGroup.querySelectorAll('.check-row').length;
      const sel = roleGroup.querySelectorAll('.check-row.checked').length;
      countEl.textContent = `${sel}/${total}`;
      countEl.classList.toggle('has-selected', sel > 0);
    });
  });

  document.getElementById('submitLogBtn').addEventListener('click', async ()=>{
    const leader = selectedLeaders.size ? Array.from(selectedLeaders).join(', ') : '(belum pilih leader)';
    const extra = document.getElementById('extraNames').value.trim();
    const attendance = {names: Array.from(selectedAttendance), extra};
    const note = document.getElementById('note').value.trim();
    const tipEl = document.getElementById('extraTip');
    const extraTip = tipEl ? tipEl.value.trim() : '';
    const btn = document.getElementById('submitLogBtn');
    btn.textContent = 'Saving…';
    btn.disabled = true;
    try{
      await saveLog(todayStr, currentSession, {leader, attendance, note, extraTip, topic: topic.action, category: topic.category, session: currentSession, completedAt: new Date().toISOString()});
      renderTicket();
    }catch(e){
      btn.textContent = 'Failed — try again';
      btn.disabled = false;
    }
  });
}



// ---------- OVERVIEW VIEW ----------
async function renderOverview(){
  const statusList = document.getElementById('outletStatusList');
  const recentList = document.getElementById('recentLogs');
  statusList.innerHTML = '<div class="loading">Memuat data…</div>';
  recentList.innerHTML = '';

  let rows = '';
  let allLogs = [];

  for(const session of SESSIONS){
    const idx = await getIndex(session);
    const done = idx.includes(todayStr);
    const streak = computeStreak(idx);

    rows += `
      <div class="outlet-row">
        <div>
          <div class="outlet-name"><span class="status-dot ${done?'done':'pending'}"></span>${session}</div>
          <div class="outlet-meta">${done ? 'Done today' : 'Not done yet'}</div>
        </div>
        <div class="streak"><b>${streak}</b><br>day streak</div>
      </div>
    `;

    const recentDates = idx.slice().reverse().slice(0,7);
    for(const d of recentDates){
      const l = await getLog(d, session);
      if(l) allLogs.push({date:d, session, ...l});
    }
  }

  statusList.innerHTML = rows;

  allLogs.sort((a,b)=> (b.date+b.session).localeCompare(a.date+a.session));
  allLogs = allLogs.slice(0,14);

  if(allLogs.length){
    recentList.innerHTML = allLogs.map(r=>{
      const att = r.attendance || {};
      const names = (att.names || []);
      const attParts = [];
      if(names.length) attParts.push(names.length + ' people: ' + names.join(', '));
      if(att.extra) attParts.push(att.extra);
      const attText = attParts.join(' · ');
      return `
      <div class="recent-log">
        <b>${r.date} · ${r.session}</b> · leader: ${r.leader}<br>
        ${r.topic}${r.note ? ' — "'+r.note+'"' : ''}${attText ? '<br>attended: '+attText : ''}${r.extraTip ? '<br>additional tip: '+r.extraTip : ''}
      </div>
    `;}).join('');
  } else {
    recentList.innerHTML = '<div class="recent-log">No logs yet.</div>';
  }

  const bank = await getTopicBank();
  document.getElementById('topicCount').textContent = `${bank.length} topics in the bank.`;
}

document.getElementById('toggleRoster').addEventListener('click', async ()=>{
  const panel = document.getElementById('rosterManage');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')) await renderRosterManage();
});

async function renderRosterManage(){
  const panel = document.getElementById('rosterManage');
  const roster = await getRoster();

  let html = '';
  ROLES.forEach(role=>{
    const names = roster[role] || [];
    html += `<div class="field-label" style="margin-top:12px;">${role} (${names.length})</div>`;
    html += names.map(n=>`
      <div class="roster-manage-row" data-role="${role}" data-name="${n.replace(/"/g,'&quot;')}">
        <span>${n}</span>
        <span class="roster-x" data-action="remove">✕</span>
      </div>
    `).join('');
  });
  html += `
    <div class="roster-add-row">
      <select id="newStaffRole">
        ${ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}
      </select>
      <input type="text" id="newStaffName" placeholder="New staff name">
      <button id="addStaffBtn" class="secondary">+ Add</button>
    </div>
  `;
  panel.innerHTML = html;

  panel.querySelectorAll('.roster-x').forEach(x=>{
    x.addEventListener('click', async ()=>{
      const row = x.closest('.roster-manage-row');
      const role = row.dataset.role;
      const name = row.dataset.name;
      const r = await getRoster();
      r[role] = (r[role] || []).filter(n=>n !== name);
      await saveRoster(r);
      renderRosterManage();
    });
  });

  document.getElementById('addStaffBtn').addEventListener('click', async ()=>{
    const role = document.getElementById('newStaffRole').value;
    const name = document.getElementById('newStaffName').value.trim();
    if(!name) return;
    const r = await getRoster();
    if(!r[role]) r[role] = [];
    if(!r[role].includes(name)) r[role].push(name);
    await saveRoster(r);
    renderRosterManage();
  });
}

document.getElementById('toggleAddTopic').addEventListener('click', ()=>{
  document.getElementById('addTopicForm').classList.toggle('hidden');
});

document.getElementById('saveTopicBtn').addEventListener('click', async ()=>{
  const category = document.getElementById('newCategory').value;
  const situation = document.getElementById('newSituation').value.trim();
  const action = document.getElementById('newAction').value.trim();
  const why = document.getElementById('newWhy').value.trim();
  if(!situation || !action || !why){
    alert('Please fill in all fields first.');
    return;
  }
  const bank = await getTopicBank();
  bank.push({category, situation, action, why});
  await window.storage.set('topic-bank', JSON.stringify(bank), true);
  document.getElementById('newSituation').value = '';
  document.getElementById('newAction').value = '';
  document.getElementById('newWhy').value = '';
  document.getElementById('addTopicForm').classList.add('hidden');
  renderOverview();
});

// ---------- TAB SWITCHING ----------
document.querySelectorAll('.main-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.view).classList.add('active');
    if(tab.dataset.view === 'overview') renderOverview();
  });
});

renderLeaderPicker();
