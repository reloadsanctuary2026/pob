<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<title>Reload — Point of Briefing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#FBF9F6;
  --paper-dark:#F0E6D8;
  --ink:#131313;
  --ink-soft:#756D64;
  --line:#DFD3C2;
  --mindset:#554132;
  --culture:#728639;
  --upsell:#800020;
  --stamp:#728639;
  --card-shadow: 0 1px 0 rgba(19,19,19,0.04), 0 8px 20px -12px rgba(19,19,19,0.25);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Poppins', sans-serif;
  font-weight:300;
  min-height:100vh;
  padding:20px 14px 60px;
}

.wrap{max-width:640px;margin:0 auto;}

.masthead{
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;
  margin-bottom:18px;
}
.masthead img{height:32px;width:auto;flex-shrink:0;}
.masthead-text{flex:1;}
.masthead h1{
  font-family:'Poppins',sans-serif;
  font-weight:800;
  letter-spacing:0.01em;
  text-transform:uppercase;
  font-size:19px;
  margin:0;
  line-height:1.1;
}
.masthead .sub{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:0.04em;
  margin-top:2px;
}

.tabs{display:flex;gap:0;margin-bottom:18px;border:2px solid var(--ink);border-radius:3px;overflow:hidden;}
.main-tab{
  flex:1;text-align:center;padding:9px 6px;
  font-family:'Poppins',sans-serif;font-weight:500;
  text-transform:uppercase;letter-spacing:0.04em;font-size:12.5px;
  cursor:pointer;background:var(--paper);color:var(--ink);user-select:none;
}
.main-tab + .main-tab{border-left:2px solid var(--ink);}
.main-tab.active{background:var(--ink);color:var(--paper);}

.view{display:none;}
.view.active{display:block;}

.ticket{background:#FFFFFF;border:1px solid var(--ink);border-radius:4px;box-shadow:var(--card-shadow);margin-bottom:16px;position:relative;}
.ticket-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px dashed var(--ink);flex-wrap:wrap;gap:8px;}
.date-mono{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
.badge-group{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.badge{
  font-family:'Poppins',sans-serif;font-weight:500;font-size:11px;letter-spacing:0.05em;
  text-transform:uppercase;padding:4px 10px;border-radius:20px;color:#fff;
}
.badge.mindset{background:var(--mindset);}
.badge.culture{background:var(--culture);}
.badge.upsell{background:var(--upsell);}
.stamp{
  font-family:'Poppins',sans-serif;font-weight:500;font-size:11px;letter-spacing:0.04em;
  color:#fff;border-radius:20px;padding:5px 12px;text-transform:uppercase;background:var(--stamp);white-space:nowrap;
}

.perforation{height:0;border-top:2px dashed var(--line);margin:0 16px;position:relative;}
.perforation::before,.perforation::after{content:'';position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:1px solid var(--ink);}
.perforation::before{left:-22px;}
.perforation::after{right:-22px;}

.ticket-body{padding:16px;}
.field-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-bottom:4px;}
.situation{font-size:14px;margin:0 0 14px;color:var(--ink-soft);}
.action{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;line-height:1.35;margin:0 0 14px;}
.why{font-size:13px;color:var(--ink-soft);font-style:italic;margin:0;}

.panel{background:#FFFFFF;border:1px solid var(--ink);border-radius:4px;padding:16px;margin-bottom:16px;box-shadow:var(--card-shadow);}
.panel h3{font-family:'Poppins',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;font-size:13px;margin:0 0 12px;color:var(--ink-soft);}

select, input[type=text], textarea{
  width:100%;font-family:'Poppins',sans-serif;font-weight:300;font-size:14px;padding:9px 10px;
  border:1px solid var(--ink);border-radius:3px;background:#fff;color:var(--ink);margin-bottom:12px;
}
textarea{resize:vertical;min-height:56px;}
label.small{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);display:block;margin-bottom:5px;}

button{
  font-family:'Poppins',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;font-size:13px;
  padding:11px 16px;border:2px solid var(--ink);border-radius:3px;background:var(--ink);color:var(--paper);cursor:pointer;width:100%;
}
button:active{transform:translateY(1px);}
button.secondary{background:transparent;color:var(--ink);}

.outlet-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
.outlet-row:last-child{border-bottom:none;}
.outlet-name{font-family:'Poppins',sans-serif;font-weight:500;font-size:14px;}
.outlet-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.status-dot.done{background:var(--culture);}
.status-dot.pending{background:var(--upsell);}
.streak{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:right;}
.streak b{color:var(--ink);font-size:13px;}

.loading{text-align:center;padding:30px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

.add-topic-toggle{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);cursor:pointer;text-decoration:underline;display:inline-block;margin-top:4px;}
.hidden{display:none;}

.mode-select{display:flex;gap:6px;margin:14px 16px 0;}
.mode-btn{
  flex:1;text-align:center;padding:7px 4px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  text-transform:uppercase;letter-spacing:0.04em;border:1px solid var(--ink);border-radius:20px;cursor:pointer;
  background:transparent;color:var(--ink);user-select:none;
}
.mode-btn.active{background:var(--ink);color:var(--paper);}

.extra-block{margin:14px 16px 16px;padding:12px 14px;border:1px dashed var(--ink);border-radius:4px;background:rgba(255,255,255,0.5);}
.extra-block .field-label{margin-bottom:8px;}
.quiz-option{
  display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border:1px solid var(--line);
  border-radius:3px;background:#fff;font-family:'Poppins',sans-serif;font-weight:300;font-size:13px;cursor:pointer;color:var(--ink);
}
.quiz-option:last-child{margin-bottom:0;}
.quiz-option.correct{border-color:var(--culture);background:#eaf1ea;}
.quiz-option.wrong{border-color:var(--upsell);background:#f6e9e6;}
.roleplay-line{font-size:13.5px;margin:0 0 8px;color:var(--ink);}
.roleplay-line b{font-family:'Poppins',sans-serif;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}

.role-group{margin-bottom:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.role-group:last-child{margin-bottom:0;}
.role-header{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--paper-dark);cursor:pointer;user-select:none;}
.role-title{font-family:'Poppins',sans-serif;font-weight:500;font-size:13.5px;color:var(--ink);}
.role-right{display:flex;align-items:center;gap:10px;}
.role-header .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
.role-header .count.has-selected{color:var(--culture);}
.chevron{font-size:11px;color:var(--ink-soft);transition:transform 0.15s;display:inline-block;}
.chevron.open{transform:rotate(180deg);}
.check-list{padding:4px 6px;background:#fff;}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--paper);cursor:pointer;user-select:none;}
.check-row:last-child{border-bottom:none;}
.check-box{width:18px;height:18px;flex-shrink:0;border:1.5px solid var(--ink-soft);border-radius:4px;position:relative;background:#fff;}
.check-row.checked .check-box{background:var(--culture);border-color:var(--culture);}
.check-row.checked .check-box::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.check-label{font-family:'Poppins',sans-serif;font-weight:300;font-size:13.5px;color:var(--ink);}
.check-row.checked .check-label{font-family:'Poppins',sans-serif;font-weight:500;color:var(--ink);}

.leader-list{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:12px;padding:4px 6px;}

.roster-manage-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.roster-manage-row:last-child{border-bottom:none;}
.roster-x{color:var(--upsell);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 8px;}
.roster-add-row{display:flex;gap:8px;margin-top:10px;}
.roster-add-row select{margin-bottom:0;width:38%;}
.roster-add-row input{margin-bottom:0;flex:1;}
.roster-add-row button{width:auto;padding:9px 14px;}

.recent-log{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);padding:8px 0;border-bottom:1px dashed var(--line);}
.recent-log:last-child{border-bottom:none;}
.recent-log b{color:var(--ink);}

@media (max-width: 480px){
  body{padding:14px 10px 50px;}
  .masthead img{height:26px;}
  .masthead h1{font-size:16px;}
  .roster-add-row{flex-direction:column;}
  .roster-add-row select, .roster-add-row input, .roster-add-row button{width:100%;}
  .action{font-size:17px;}
  .check-row{padding:11px 8px;}
  .main-tab{font-size:11.5px;padding:10px 6px;}
}
</style>
</head>

<script>
const ROLES = ['Server','Cashier','Hostess','Runner'];
const SESSIONS = ['Pagi','Sore','Malam'];
const CAT_LABEL = {mindset:'Hospitality Mindset', culture:'Service Culture', upsell:'Upselling Tip'};

function autoSession(date){
  const h = date.getHours() + date.getMinutes()/60;
  if(h < 5) return 'Malam';
  if(h < 11.5) return 'Pagi';
  if(h < 17) return 'Sore';
  return 'Malam';
}

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby6sdrGHM2GBESHsVmrh21lDXesn7bBqnctkE5q-Jvjrli1MEPwPzF74vp8RFYsa78CXA/exec';

// ---------- server bridge (via fetch, karena file ini di-host di luar Apps Script) ----------
async function gsCall(action, params, method){
  method = method || 'GET';
  if(method === 'GET'){
    const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
    const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`);
    return res.json();
  } else {
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action}, params||{}))
    });
    return res.json();
  }
}
// gsRun kept as a thin wrapper so the rest of the app code below doesn't need to change
function gsRun(fnName, ...args){
  switch(fnName){
    case 'apiGetRoster': return gsCall('getRoster');
    case 'apiSaveRoster': return gsCall('saveRoster', {roster: args[0]}, 'POST');
    case 'apiGetLeaders': return gsCall('getLeaders');
    case 'apiGetTopics': return gsCall('getTopics');
    case 'apiAddTopic': return gsCall('addTopic', {topic: args[0]}, 'POST');
    case 'apiGetLog': return gsCall('getLog', {date: args[0], session: args[1]});
    case 'apiSaveLog': return gsCall('saveLog', {date: args[0], session: args[1], data: args[2]}, 'POST');
    case 'apiGetSessionDates': return gsCall('getSessionDates', {session: args[0]});
    case 'apiGetRecentLogs': return gsCall('getRecentLogs', {limit: args[0]});
    default: return Promise.reject(new Error('Unknown fn: '+fnName));
  }
}

let todayStr = new Date().toISOString().slice(0,10);
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

function computeStreak(dates){
  if(!dates.length) return 0;
  const set = new Set(dates);
  let streak = 0;
  let cur = new Date(todayStr+'T00:00:00');
  if(!set.has(todayStr)) cur.setDate(cur.getDate()-1);
  while(true){
    const ds = cur.toISOString().slice(0,10);
    if(set.has(ds)){ streak++; cur.setDate(cur.getDate()-1); } else break;
  }
  return streak;
}

// ---------- LEADER PICKER ----------
let selectedLeaders = new Set();
let leaderListCache = [];

async function renderLeaderPicker(){
  leaderListCache = await gsRun('apiGetLeaders');
  const el = document.getElementById('leaderPicker');
  el.innerHTML = `<div class="leader-list">${leaderListCache.map(name=>`
    <div class="check-row leader-row ${selectedLeaders.has(name)?'checked':''}" data-name="${name.replace(/"/g,'&quot;')}">
      <span class="check-box"></span><span class="check-label">${name}</span>
    </div>
  `).join('')}</div>`;
  el.querySelectorAll('.leader-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const name = row.dataset.name;
      if(selectedLeaders.has(name)) selectedLeaders.delete(name);
      else selectedLeaders.add(name);
      row.classList.toggle('checked');
    });
  });
}

// ---------- LEADER VIEW / TICKET ----------
let currentMode = 'ticket';
let selectedAttendance = new Set();
let extraNamesValue = '';
let extraTipValue = '';
let attendanceLoaded = false;
let expandedRoles = new Set();
let currentSession = autoSession(new Date());

function chipListHTML(roster){
  return ROLES.map(role=>{
    const names = roster[role] || [];
    if(!names.length) return '';
    const selectedCount = names.filter(n=>selectedAttendance.has(n)).length;
    const isOpen = expandedRoles.has(role);
    const rows = names.map(n=>`
      <div class="check-row" data-name="${n.replace(/"/g,'&quot;')}">
        <span class="check-box ${selectedAttendance.has(n)?'':''}"></span><span class="check-label">${n}</span>
      </div>
    `).join('');
    return `<div class="role-group" data-role-group="${role}">
      <div class="role-header" data-role="${role}">
        <span class="role-title">${role}</span>
        <span class="role-right">
          <span class="count ${selectedCount>0?'has-selected':''}">${selectedCount}/${names.length}</span>
          <span class="chevron ${isOpen?'open':''}">▾</span>
        </span>
      </div>
      <div class="check-list ${isOpen?'':'hidden'}">${rows}</div>
    </div>`;
  }).join('');
}

function extraBlockHTML(topic, mode){
  if(mode === 'quiz'){
    const opts = topic.quizOptions.map((o,i)=>`<button class="quiz-option" data-idx="${i}" data-correct="${topic.quizCorrect}">${o}</button>`).join('');
    return `<div class="extra-block"><div class="field-label">Kuis Cepat — Tanya ke Staff</div><p class="roleplay-line">${topic.quizQ}</p><div id="quizOptions">${opts}</div></div>`;
  }
  if(mode === 'roleplay'){
    return `<div class="extra-block"><div class="field-label">Roleplay — 1 Menit</div><p class="roleplay-line"><b>Setup: </b>${topic.roleplaySetup}</p><p class="roleplay-line"><b>Panduan: </b>${topic.roleplayGuide}</p></div>`;
  }
  return '';
}

function dayIndexOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const start = new Date(d.getFullYear(),0,0);
  return Math.floor((d-start)/86400000);
}

async function renderTicket(){
  const detected = autoSession(new Date());
  if(detected !== currentSession){ currentSession = detected; attendanceLoaded = false; }

  const container = document.getElementById('ticketContainer');
  container.innerHTML = '<div class="loading">Menyiapkan tiket hari ini…</div>';

  const [bank, roster, existing] = await Promise.all([
    gsRun('apiGetTopics'),
    gsRun('apiGetRoster'),
    gsRun('apiGetLog', todayStr, currentSession)
  ]);

  const topic = bank[dayIndexOf(todayStr) % bank.length];

  if(!attendanceLoaded){
    if(existing && existing.attendance){
      selectedAttendance = new Set(existing.attendance.names || []);
      extraNamesValue = existing.attendance.extra || '';
    } else {
      selectedAttendance = new Set();
      extraNamesValue = '';
    }
    extraTipValue = (existing && existing.extraTip) ? existing.extraTip : '';
    attendanceLoaded = true;
  }

  const catClass = topic.category;
  const catLabel = CAT_LABEL[topic.category];
  const hasExtras = topic.quizQ && topic.roleplaySetup;
  const isMalam = currentSession === 'Malam';

  const ticketBodyHTML = isMalam ? `
      <div class="ticket-body">
        <div class="field-label">Review — Recap Materi Hari Ini</div>
        <p class="action">${topic.action}</p>
        <div class="field-label">Kenapa Penting</div>
        <p class="why">${topic.why}</p>
      </div>
  ` : `
      <div class="ticket-body">
        <div class="field-label">Situasi</div>
        <p class="situation">${topic.situation}</p>
        <div class="perforation"></div>
        <div class="field-label" style="margin-top:14px;">Aksi Konkret</div>
        <p class="action">${topic.action}</p>
        <div class="field-label">Kenapa Penting</div>
        <p class="why">${topic.why}</p>
      </div>
  `;

  container.innerHTML = `
    <div class="ticket">
      <div class="ticket-head">
        <span class="date-mono">${todayStr} · ${currentSession}</span>
        <div class="badge-group">
          <span class="badge ${catClass}">${catLabel}</span>
          ${existing ? '<span class="stamp">Selesai</span>' : ''}
        </div>
      </div>
      ${ticketBodyHTML}
      ${hasExtras ? `
      <div class="mode-select">
        <div class="mode-btn ${currentMode==='ticket'?'active':''}" data-mode="ticket">Tiket</div>
        <div class="mode-btn ${currentMode==='quiz'?'active':''}" data-mode="quiz">+ Kuis</div>
        <div class="mode-btn ${currentMode==='roleplay'?'active':''}" data-mode="roleplay">+ Roleplay</div>
      </div>
      <div id="extraBlockContainer">${extraBlockHTML(topic, currentMode)}</div>
      ` : ''}
    </div>

    <div class="panel">
      <h3>${existing ? 'Update Catatan Briefing' : 'Tandai Briefing Selesai'}</h3>
      <label class="small">Siapa yang hadir — tap nama</label>
      <div id="attendanceChips">${chipListHTML(roster)}</div>
      <label class="small" style="margin-top:10px;">+ nama lain (opsional, pisah koma)</label>
      <input type="text" id="extraNames" placeholder="mis. staff freelance/trainee" value="${extraNamesValue.replace(/"/g,'&quot;')}">
      ${isMalam ? `
      <label class="small">Tips tambahan (opsional, kalau ada)</label>
      <textarea id="extraTip" placeholder="mis. ada kejadian baru hari ini yang perlu di-share">${extraTipValue.replace(/</g,'&lt;')}</textarea>
      ` : ''}
      <label class="small">Catatan (opsional)</label>
      <textarea id="note" placeholder="mis. staff masih ragu buat praktekin langsung">${existing ? existing.note : ''}</textarea>
      <button id="submitLogBtn">${existing ? 'Update Catatan' : 'Tandai Selesai'}</button>
    </div>
  `;

  // mark checked state properly (done after innerHTML since template above simplified)
  container.querySelectorAll('.check-row[data-name]').forEach(row=>{
    const name = row.dataset.name;
    if(selectedAttendance.has(name)){
      row.classList.add('checked');
    }
  });

  if(hasExtras){
    container.querySelectorAll('.mode-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        extraNamesValue = document.getElementById('extraNames').value;
        const tipEl = document.getElementById('extraTip');
        if(tipEl) extraTipValue = tipEl.value;
        currentMode = btn.dataset.mode;
        renderTicket();
      });
    });
    if(currentMode === 'quiz'){
      container.querySelectorAll('.quiz-option').forEach(opt=>{
        opt.addEventListener('click', ()=>{
          const correct = parseInt(opt.dataset.correct);
          container.querySelectorAll('.quiz-option').forEach((o,i)=>{
            if(i === correct) o.classList.add('correct');
            else if(o === opt) o.classList.add('wrong');
          });
        });
      });
    }
  }

  container.querySelectorAll('.role-header').forEach(header=>{
    header.addEventListener('click', ()=>{
      const role = header.dataset.role;
      const list = header.parentElement.querySelector('.check-list');
      const chevron = header.querySelector('.chevron');
      if(expandedRoles.has(role)){
        expandedRoles.delete(role); list.classList.add('hidden'); chevron.classList.remove('open');
      } else {
        expandedRoles.add(role); list.classList.remove('hidden'); chevron.classList.add('open');
      }
    });
  });

  container.querySelectorAll('#attendanceChips .check-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const name = row.dataset.name;
      if(selectedAttendance.has(name)) selectedAttendance.delete(name);
      else selectedAttendance.add(name);
      row.classList.toggle('checked');
      const roleGroup = row.closest('.role-group');
      const countEl = roleGroup.querySelector('.count');
      const total = roleGroup.querySelectorAll('.check-row').length;
      const sel = roleGroup.querySelectorAll('.check-row.checked').length;
      countEl.textContent = `${sel}/${total}`;
      countEl.classList.toggle('has-selected', sel > 0);
    });
  });

  document.getElementById('submitLogBtn').addEventListener('click', async ()=>{
    const leader = selectedLeaders.size ? Array.from(selectedLeaders).join(', ') : '(belum pilih leader)';
    const extra = document.getElementById('extraNames').value.trim();
    const attendance = {names: Array.from(selectedAttendance), extra};
    const note = document.getElementById('note').value.trim();
    const tipEl = document.getElementById('extraTip');
    const extraTip = tipEl ? tipEl.value.trim() : '';
    const btn = document.getElementById('submitLogBtn');
    btn.textContent = 'Menyimpan…';
    btn.disabled = true;
    try{
      await gsRun('apiSaveLog', todayStr, currentSession, {leader, attendance, note, extraTip, topic: topic.action, category: topic.category, completedAt: new Date().toISOString()});
      renderTicket();
    }catch(e){
      btn.textContent = 'Gagal — coba lagi';
      btn.disabled = false;
    }
  });
}

// ---------- OVERVIEW VIEW ----------
async function renderOverview(){
  const statusList = document.getElementById('outletStatusList');
  const recentList = document.getElementById('recentLogs');
  statusList.innerHTML = '<div class="loading">Memuat data…</div>';
  recentList.innerHTML = '';

  let rows = '';
  for(const session of SESSIONS){
    const idx = await gsRun('apiGetSessionDates', session);
    const done = idx.includes(todayStr);
    const streak = computeStreak(idx);
    rows += `
      <div class="outlet-row">
        <div>
          <div class="outlet-name"><span class="status-dot ${done?'done':'pending'}"></span>${session}</div>
          <div class="outlet-meta">${done ? 'Selesai hari ini' : 'Belum dilakukan'}</div>
        </div>
        <div class="streak"><b>${streak}</b><br>hari beruntun</div>
      </div>
    `;
  }
  statusList.innerHTML = rows;

  const allLogs = await gsRun('apiGetRecentLogs', 14);
  if(allLogs.length){
    recentList.innerHTML = allLogs.map(r=>{
      const att = r.attendance || {};
      const names = (att.names || []);
      const attParts = [];
      if(names.length) attParts.push(names.length + ' orang: ' + names.join(', '));
      if(att.extra) attParts.push(att.extra);
      const attText = attParts.join(' · ');
      return `
      <div class="recent-log">
        <b>${r.date} · ${r.session}</b> · leader: ${r.leader}<br>
        ${r.topic}${r.note ? ' — "'+r.note+'"' : ''}${attText ? '<br>hadir: '+attText : ''}${r.extraTip ? '<br>tips tambahan: '+r.extraTip : ''}
      </div>
    `;}).join('');
  } else {
    recentList.innerHTML = '<div class="recent-log">Belum ada log.</div>';
  }

  const bank = await gsRun('apiGetTopics');
  document.getElementById('topicCount').textContent = `${bank.length} topik di bank materi.`;
}

document.getElementById('toggleRoster').addEventListener('click', async ()=>{
  const panel = document.getElementById('rosterManage');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')) await renderRosterManage();
});

async function renderRosterManage(){
  const panel = document.getElementById('rosterManage');
  const roster = await gsRun('apiGetRoster');

  let html = '';
  ROLES.forEach(role=>{
    const names = roster[role] || [];
    html += `<div class="field-label" style="margin-top:12px;">${role} (${names.length})</div>`;
    html += names.map(n=>`
      <div class="roster-manage-row" data-role="${role}" data-name="${n.replace(/"/g,'&quot;')}">
        <span>${n}</span><span class="roster-x" data-action="remove">✕</span>
      </div>
    `).join('');
  });
  html += `
    <div class="roster-add-row">
      <select id="newStaffRole">${ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
      <input type="text" id="newStaffName" placeholder="Nama staff baru">
      <button id="addStaffBtn" class="secondary">+ Tambah</button>
    </div>
  `;
  panel.innerHTML = html;

  panel.querySelectorAll('.roster-x').forEach(x=>{
    x.addEventListener('click', async ()=>{
      const row = x.closest('.roster-manage-row');
      const role = row.dataset.role, name = row.dataset.name;
      const r = await gsRun('apiGetRoster');
      r[role] = (r[role] || []).filter(n=>n !== name);
      await gsRun('apiSaveRoster', r);
      renderRosterManage();
    });
  });

  document.getElementById('addStaffBtn').addEventListener('click', async ()=>{
    const role = document.getElementById('newStaffRole').value;
    const name = document.getElementById('newStaffName').value.trim();
    if(!name) return;
    const r = await gsRun('apiGetRoster');
    if(!r[role]) r[role] = [];
    if(!r[role].includes(name)) r[role].push(name);
    await gsRun('apiSaveRoster', r);
    renderRosterManage();
  });
}

document.getElementById('toggleAddTopic').addEventListener('click', ()=>{
  document.getElementById('addTopicForm').classList.toggle('hidden');
});

document.getElementById('saveTopicBtn').addEventListener('click', async ()=>{
  const category = document.getElementById('newCategory').value;
  const situation = document.getElementById('newSituation').value.trim();
  const action = document.getElementById('newAction').value.trim();
  const why = document.getElementById('newWhy').value.trim();
  if(!situation || !action || !why){ alert('Isi semua field dulu ya.'); return; }
  await gsRun('apiAddTopic', {category, situation, action, why});
  document.getElementById('newSituation').value = '';
  document.getElementById('newAction').value = '';
  document.getElementById('newWhy').value = '';
  document.getElementById('addTopicForm').classList.add('hidden');
  renderOverview();
});

document.querySelectorAll('.main-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.view).classList.add('active');
    if(tab.dataset.view === 'overview') renderOverview();
  });
});

// init
renderLeaderPicker();
renderTicket();
